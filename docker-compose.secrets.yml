version: '3.8'

# Docker Secrets for encryption keys (created on the server, not in git)
secrets:
  encryption_dek_v1:
    external: true
  encryption_hmac_key_v1:
    external: true
  # For future key rotation:
  # encryption_dek_v2:
  #   external: true
  # encryption_hmac_key_v2:
  #   external: true

services:
  api:
    image: idealize-server:latest
    environment:
      KEY_PROVIDER: docker-secret
      ENCRYPTION_KEY_VERSION: v1
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/idealize_db
      PORT: 6000

    secrets:
      - encryption_dek_v1
      - encryption_hmac_key_v1

    # Run with reduced privileges in production
    user: node
    read_only: true
    tmpfs:
      - /tmp

    depends_on:
      - mongo
    ports:
      - "6000:6000"
    networks:
      - idealize-network

  mongo:
    image: mongo:6
    volumes:
      - mongo-data:/data/db
    networks:
      - idealize-network

networks:
  idealize-network:
    driver: overlay

volumes:
  mongo-data: